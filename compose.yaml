services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-carx}
      MYSQL_USER: ${MYSQL_USER:-carx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-carx-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-carx-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-carx}
    volumes: [minio-data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-carx-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-carx}
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 1; done; mc mb --ignore-existing \"local/$${MINIO_BUCKET}\""]
  backend:
    build: .
    depends_on:
      mysql: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-carx}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-carx}
      DB_PASSWORD: ${MYSQL_PASSWORD:-carx-local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_must_be_set}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:8088}
      APP_RATE_LIMIT_TRUST_PROXY_HEADERS: "true"
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-carx}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-carx-local-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-carx}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["8088:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  mysql-data:
  minio-data:
